<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — OpenTech</title>
  <meta name="theme-color" content="#101010" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
  <main class="section" style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="padding: 24px;">
      <h2 class="section__title text-center mb-4" data-i18n="register_title">Yi Rajista</h2>
      <form id="registerForm" class="flex-col gap-3">
        <div class="field">
          <label class="field__label" data-i18n="name_label">Full Name</label>
          <input type="text" name="fullName" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label" data-i18n="email_label">Email</label>
          <input type="email" name="email" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label" data-i18n="phone_label">Phone</label>
          <input type="tel" name="phone" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label" data-i18n="password_label">Password</label>
          <input type="password" name="password" class="field__input" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-2" data-i18n="register_btn">Yi Rajista</button>
      </form>
      <div class="text-center mt-4" style="font-size:12px;">
        <span class="text-muted">Already have an account?</span>
        <a href="/login" class="text-gold" data-i18n="login_link">Log in</a>
      </div>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
