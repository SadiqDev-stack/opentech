<!DOCTYPE html>
<html lang="ha">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
  <main class="section">
    <div class="section__head">
      <div>
        <h1 class="section__title" data-i18n="academy_title">Kwasa-kwasan OpenTech</h1>
        <p class="section__sub" data-i18n="academy_sub">Koyi sana'a ta hannu a saukake.</p>

    </div>
    <div class="relative mb-4">
      <i class="fa-solid fa-search absolute left-3 top-3 text-muted" style="position:absolute; left:12px; top:12px; color:var(--color-muted)"></i>
      <input type="search" id="courseSearchInput" class="field__input" placeholder="Search courses..." style="padding-left: 36px;" />

    <div class="grid-3" id="coursesGrid">
