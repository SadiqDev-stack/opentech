<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="section" style="max-width: 900px; margin: 0 auto;">
    <div class="flex items-center gap-3 mb-4 p-4" style="background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-lg);">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-gold font-bold" style="background:rgba(198,160,82,0.2); border:1px solid var(--color-gold);"><i class="fa-solid fa-user"></i></div>
      <div style="flex:1;"><div class="font-bold text-white account-name">Loading...</div></div>
    </div>
    <div id="accountNav"></div>
    
    <div id="panel-reports" class="tab-panel mt-4">
      <h2 class="section__title mb-2">Submit a Report</h2>
      <p class="text-muted text-sm mb-4">Complaints about payments, orders, courses, or project requests.</p>
      
      <form id="reportForm" class="card p-5 mb-6">
        <div class="field mb-3">
          <label class="field__label">Subject</label>
          <input type="text" name="subject" class="field__input" required>
        </div>
        <div class="field mb-3">
          <label class="field__label">Category</label>
          <select name="category" class="field__input" required>
            <option value="payment">Payments</option>
            <option value="order">Orders</option>
            <option value="course">Courses</option>
            <option value="project">Project Requests</option>
            <option value="other">Other Issues</option>
          </select>
        </div>
        <div class="field mb-3">
          <label class="field__label">Attachment (Optional)</label>
          <input type="file" id="reportAttachment" class="field__input" accept="image/*,.pdf">
          <input type="hidden" name="attachmentUrl" id="reportAttachmentUrl">
        </div>
        <div class="field mb-3">
          <label class="field__label">Description</label>
          <textarea name="description" class="field__input" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn--primary"><i class="fa-solid fa-paper-plane"></i> Submit Report</button>
      </form>

      <h3 class="font-bold text-white mb-3">Previous Reports</h3>
      <div id="reportsList" class="flex-col gap-4">
        <div class="skeleton skeleton--card"></div>
      </div>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/account.js"></script>
  <script>
    (async function() {
      const form = document.getElementById('reportForm');
      const fileInput = document.getElementById('reportAttachment');
      const container = document.getElementById('reportsList');

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const sigRes = await App.api.get('/uploads/signature');
          const { signature, timestamp, folder, apiKey, cloudName } = sigRes.data;
          const formData = new FormData();
          formData.append('file', file);
          formData.append('api_key', apiKey);
          formData.append('timestamp', timestamp);
          formData.append('signature', signature);
          formData.append('folder', folder);
          const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/auto/upload`, {
            method: 'POST', body: formData
          });
          const cloudData = await cloudRes.json();
          if (cloudData.secure_url) {
            document.getElementById('reportAttachmentUrl').value = cloudData.secure_url;
            App.notify.success('Attachment uploaded');
          }
        } catch (err) { App.notify.error('Upload failed'); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        await App.form.submit(form, async (data) => {
          await App.api.post('/reports', data);
          App.notify.success('Report submitted');
          form.reset();
          loadReports();
        });
      });

      async function loadReports() {
        try {
          const res = await App.api.get('/reports/mine');
          if (!res.data || res.data.length === 0) {
            container.innerHTML = App.render.empty('fa-flag', 'No previous reports.');
            return;
          }
          container.innerHTML = res.data.map(r => `
            <div class="card p-4 mb-3">
              <div class="flex justify-between items-center border-b border-surface-border pb-2 mb-2">
                <div>
                  <span class="font-bold text-white">${r.subject}</span>
                  <span class="text-muted text-xs block">Category: ${r.category}</span>
                </div>
                <span class="badge ${r.status === 'resolved' ? 'badge--success' : 'badge--error'}">${r.status.toUpperCase()}</span>
              </div>
              <p class="text-muted text-xs mb-2">${r.description}</p>
              ${r.adminResponse ? `<div class="p-3" style="background:var(--color-elevated); border-radius:8px; font-size:12px;"><span class="text-gold font-bold block mb-1">Admin Response</span><p class="text-white m-0">${r.adminResponse}</p></div>` : ''}
            </div>
          `).join('');
        } catch (err) { console.error(err); }
      }

      loadReports();
    })();
  </script>
</body>
</html>
