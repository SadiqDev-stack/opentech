<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="section" style="max-width: 900px; margin: 0 auto;">
    <div class="flex items-center gap-3 mb-4 p-4" style="background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-lg);">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-gold font-bold" style="background:rgba(198,160,82,0.2); border:1px solid var(--color-gold);"><i class="fa-solid fa-user"></i></div>
      <div style="flex:1;">
        <div class="font-bold text-white account-name">Loading...</div>
        <div class="text-muted text-xs">Customer</div>
      </div>
      <button class="btn btn--outline btn--sm" onclick="App.auth.logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
    
    <div id="accountNav"></div>

    <div class="grid-2 mt-4" style="grid-template-columns: repeat(4, 1fr);">
      <div class="card p-4" style="text-align:center;">
        <span class="text-muted text-xs block mb-1">Orders</span>
        <span id="statOrders" class="stat__value text-white">0</span>
      </div>
      <div class="card p-4" style="text-align:center;">
        <span class="text-muted text-xs block mb-1">Courses</span>
        <span id="statCourses" class="stat__value text-gold">0</span>
      </div>
      <div class="card p-4" style="text-align:center;">
        <span class="text-muted text-xs block mb-1">Requests</span>
        <span id="statRequests" class="stat__value text-white">0</span>
      </div>
      <div class="card p-4" style="text-align:center;">
        <span class="text-muted text-xs block mb-1">Reports</span>
        <span id="statReports" class="stat__value text-white">0</span>
      </div>
    </div>

    <div class="card mt-4 p-4">
      <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">Recent Activity</h3>
      <div id="recentActivity" class="flex-col gap-3">
        <div class="skeleton skeleton--line"></div>
      </div>
    </div>
  </main>
  
  <script src="/js/core.js"></script>
  <script src="/js/account.js"></script>
  <script>
    (async function() {
      try {
        const res = await App.api.get('/dashboard/summary');
        const { counts, recentActivity } = res.data;
        
        document.getElementById('statOrders').textContent = counts.orders;
        document.getElementById('statCourses').textContent = counts.courses;
        document.getElementById('statRequests').textContent = counts.requests;
        document.getElementById('statReports').textContent = counts.reports;

        const actEl = document.getElementById('recentActivity');
        if (recentActivity.length === 0) {
          actEl.innerHTML = '<p class="text-muted text-xs">No recent activity.</p>';
          return;
        }
        actEl.innerHTML = recentActivity.map(a => `
          <div class="flex justify-between items-center p-2" style="border-bottom:1px solid var(--color-border); font-size:13px;">
            <span class="text-white">${a.text}</span>
            <span class="text-muted text-xs">${new Date(a.date).toLocaleDateString()}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
