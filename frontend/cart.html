<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="section" style="max-width: 800px;">
    <div class="section__head">
      <div><h1 class="section__title">Shopping Cart</h1></div>
    </div>
    <div id="cartItems" class="flex-col gap-3"></div>
    
    <div id="cartSummary" class="mt-4 hidden" style="background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:16px;">
      <div class="flex justify-between mb-2">
        <span class="text-muted">Subtotal</span>
        <span id="cartSubtotal" class="text-gold font-bold">₦0</span>
      </div>
      <button class="btn btn--primary btn--block mt-4" onclick="window.location.href='/store?checkout=true'">Purchase All</button>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
