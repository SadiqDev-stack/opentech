<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — OpenTech</title>
  <meta name="theme-color" content="#101010" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
  <main class="section">
    <div class="section__head">
      <div><h1 class="section__title" data-i18n="cart_title">Keken Siyayya</h1></div>
    </div>
    <div id="cartItems" class="flex-col gap-3"></div>
    
    <div id="cartSummary" class="mt-4 hidden" style="background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:16px;">
      <div class="flex justify-between mb-2">
        <span class="text-muted" data-i18n="cart_subtotal">Subtotal</span>
        <span id="cartSubtotal" class="text-gold font-bold">₦0</span>
      </div>
      <div class="flex justify-between mb-4">
        <span class="text-muted" data-i18n="cart_total">Total</span>
        <span id="cartTotal" class="text-gold font-bold" style="font-size:18px;">₦0</span>
      </div>
      <a href="/checkout" class="btn btn--primary btn--block" data-i18n="checkout_btn">Purchase All</a>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
