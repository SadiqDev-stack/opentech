<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — OpenTech</title>
  <meta name="theme-color" content="#101010" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
  <main class="section" style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="padding: 24px; border-color: var(--color-gold);">
      <h2 class="section__title text-center mb-2" style="color:var(--color-gold)">Admin Portal</h2>
      <form id="adminLoginForm" class="flex-col gap-3">
        <div class="field">
          <label class="field__label">Admin Email</label>
          <input type="email" name="email" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label">Password</label>
          <input type="password" name="password" class="field__input" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-2">Login to Dashboard</button>
      </form>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
