<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — OpenTech</title>
  <meta name="theme-color" content="#101010" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
  <main class="section" style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="padding: 24px;">
      <h2 class="section__title text-center mb-2" data-i18n="forgot_title">Sake Kalmar Sirri</h2>
      <p class="text-muted text-center mb-4" style="font-size:12px;" data-i18n="forgot_sub">Shigar da email da sabuwar kalmar sirri.</p>
      <form id="forgotForm" class="flex-col gap-3">
        <div class="field">
          <label class="field__label" data-i18n="email_label">Email</label>
          <input type="email" name="email" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label" data-i18n="new_password_label">New Password</label>
          <input type="password" name="password" class="field__input" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-2" data-i18n="send_link_btn">Tura Hanyar</button>
      </form>
      <div class="text-center mt-4" style="font-size:12px;">
        <a href="/login" class="text-gold" data-i18n="back_to_login">Koma Shiga</a>
      </div>
    </div>
  </main>
  <script src="/js/core.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
