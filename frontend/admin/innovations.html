<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Innovations — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div class="admin-page-content">
    <h1 class="section__title mb-4">Innovation Requests</h1>
    <div id="requestsList" class="flex-col gap-4">
      <div class="skeleton skeleton--card"></div>
    </div>
  </div>
  <script src="/js/core.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    async function loadRequests() {
      const container = document.getElementById('requestsList');
      try {
        const res = await App.api.get('/admin/requests');
        if (res.data.length === 0) { container.innerHTML = App.render.empty('fa-microchip', 'No requests yet'); return; }
        container.innerHTML = res.data.map(r => `
          <div class="card p-4 mb-3">
            <div class="flex justify-between items-center border-b border-surface-border pb-2 mb-2">
              <div>
                <span class="font-bold text-white">#${r.requestNumber}: ${r.title}</span>
                <span class="text-muted text-xs block">From: ${r.user?.fullName} (${r.user?.email})</span>
              </div>
              <select onchange="updateRequestStatus('${r._id}', this.value)" class="field__input" style="width:auto; padding:4px; font-size:12px;">
                <option value="submitted" ${r.status==='submitted'?'selected':''}>Submitted</option>
                <option value="pending" ${r.status==='pending'?'selected':''}>Pending</option>
                <option value="completed" ${r.status==='completed'?'selected':''}>Completed</option>
                <option value="cancelled" ${r.status==='cancelled'?'selected':''}>Cancelled</option>
              </select>
            </div>
            <p class="text-white text-sm mb-2">${r.description}</p>
            <div class="flex gap-2">
              <button class="btn btn--primary btn--sm" onclick="App.notify.success('SMS Sent')">Send Quote SMS</button>
            </div>
          </div>
        `).join('');
      } catch (err) { container.innerHTML = '<p class="text-error">Failed to load requests</p>'; }
    }

    async function updateRequestStatus(id, status) {
      try {
        await App.api.put(`/admin/requests/${id}`, { status });
        App.notify.success('Request status updated');
      } catch (err) { App.notify.error('Update failed'); }
    }

    loadRequests();
  </script>
</body>
</html>
