<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Settings — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" /><link rel="stylesheet" href="/css/layout.css" /><link rel="stylesheet" href="/css/components.css" /><link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div>
    <h1 class="section__title mb-4">System Settings</h1>
    <p class="text-muted text-sm mb-4">Credentials are stored securely in the database. Clear a field and save to remove it.</p>
    <form id="settingsForm" class="flex-col gap-4" style="max-width:700px;">
      <div class="card p-4">
        <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">Paystack</h3>
        <div class="field mb-3"><label class="field__label">Public Key</label><input type="password" name="paystackPublicKey" class="field__input"></div>
        <div class="field mb-3"><label class="field__label">Secret Key</label><input type="password" name="paystackSecretKey" class="field__input"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">Cloudinary</h3>
        <div class="field mb-3"><label class="field__label">Cloud Name</label><input type="text" name="cloudinaryCloudName" class="field__input"></div>
        <div class="field mb-3"><label class="field__label">API Key</label><input type="password" name="cloudinaryApiKey" class="field__input"></div>
        <div class="field mb-3"><label class="field__label">API Secret</label><input type="password" name="cloudinaryApiSecret" class="field__input"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">SMTP (Email)</h3>
        <div class="field mb-3"><label class="field__label">Host</label><input type="text" name="smtpHost" class="field__input" placeholder="smtp.gmail.com"></div>
        <div class="field mb-3"><label class="field__label">Port</label><input type="number" name="smtpPort" class="field__input" placeholder="587"></div>
        <div class="field mb-3"><label class="field__label">User</label><input type="text" name="smtpUser" class="field__input"></div>
        <div class="field mb-3"><label class="field__label">Password</label><input type="password" name="smtpPass" class="field__input"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">SMS (eBulkSMS)</h3>
        <div class="field mb-3"><label class="field__label">Username</label><input type="text" name="ebulkSmsUsername" class="field__input"></div>
        <div class="field mb-3"><label class="field__label">API Key</label><input type="password" name="ebulkSmsApiKey" class="field__input"></div>
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-white mb-3 border-b border-surface-border pb-2">Maintenance Mode</h3>
        <label class="flex items-center gap-2 text-white"><input type="checkbox" name="maintenanceMode"> Enable Maintenance</label>
      </div>
      <button type="submit" class="btn btn--primary"><i class="fa-solid fa-save"></i> Save Settings</button>
    </form>
  </div>
  <script src="/js/core.js"></script>
  <script>
    (async function () {
      try {
        const res = await App.api.get('/settings');
        const s = res.data;
        Object.keys(s).forEach(k => {
          const el = document.querySelector(`[name="${k}"]`);
          if (el) {
            if (el.type === 'checkbox') el.checked = !!s[k];
            else el.value = s[k] || '';
          }
        });
      } catch (e) { App.notify.error('Failed to load settings'); }
      
      document.getElementById('settingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {};
        fd.forEach((v, k) => { payload[k] = k === 'maintenanceMode' ? v === 'on' : v; });
        await App.form.submit(e.target, async () => {
          await App.api.put('/settings', payload);
          App.notify.success('Settings saved');
        });
      });
    })();
  </script>
  <script src="/js/admin.js"></script>
</body>
</html>
