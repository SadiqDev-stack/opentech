<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store — OpenTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="section">
    <div class="section__head">
      <div>
        <h1 class="section__title" data-i18n="store_title">Shagon OpenTech</h1>
        <p class="section__sub" data-i18n="store_sub">Kayan lantarki, sensors da kayan gwaji.</p>
      </div>
    </div>
    <div class="relative mb-4">
      <i class="fa-solid fa-search" style="position:absolute; left:12px; top:12px; color:var(--color-muted)"></i>
      <input type="search" id="productSearch" class="field__input" placeholder="Search products..." style="padding-left:36px;" />
    </div>
    <div class="grid-3" id="productsGrid">
      <div class="skeleton skeleton--card"></div>
    </div>
  </main>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="modal">
    <div class="modal__sheet">
      <div class="modal__head">
        <div>
          <h3 class="modal__title">Checkout</h3>
          <p class="modal__sub" id="checkoutItemCount">0 items</p>
        </div>
        <button class="modal__close" data-modal-close="checkoutModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="checkoutForm" class="flex-col gap-3">
        <div class="field">
          <label class="field__label">Full Name</label>
          <input type="text" name="fullName" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label">Email</label>
          <input type="email" name="email" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label">Phone Number</label>
          <input type="tel" name="phone" class="field__input" required />
        </div>
        <div class="field">
          <label class="field__label">Delivery Address</label>
          <textarea name="address" class="field__input" required rows="2"></textarea>
        </div>
        <div class="flex justify-between items-center p-3 mt-2" style="background:var(--color-elevated); border-radius:var(--radius);">
          <span class="text-muted">Total Amount</span>
          <span class="text-gold font-bold" id="checkoutTotal">₦0</span>
        </div>
        <button type="submit" class="btn btn--primary w-full mt-2">Pay with Paystack</button>
      </form>
    </div>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/store.js"></script>
</body>
</html>
